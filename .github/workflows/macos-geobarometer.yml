name: macOS build and geobarometer tests

on:
  push:
    branches: [main, macos-build]
  workflow_dispatch:

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4

      - name: Static dependencies (GLFW, GSL, libxlsxwriter; fmt headers)
        run: |
          set -e
          P=$HOME/deps/prefix; mkdir -p $P && cd $HOME/deps
          brew install fmt
          git clone -q --depth 1 --branch 3.4 https://github.com/glfw/glfw.git
          cmake -S glfw -B glfw/build -DBUILD_SHARED_LIBS=OFF -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF \
                -DGLFW_BUILD_DOCS=OFF -DCMAKE_INSTALL_PREFIX=$P -DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET > /dev/null
          cmake --build glfw/build --target install -j 4 > /dev/null
          # Test-only GLFW that also accepts Apple's software OpenGL renderer: the hosted Macs have
          # no GPU OpenGL, and stock GLFW insists on an accelerated pixel format. easyMelts itself
          # is linked against the stock GLFW above.
          cp -R glfw glfw_sw && rm -rf glfw_sw/build
          grep -c "ADD_ATTRIB(NSOpenGLPFAAccelerated);" glfw_sw/src/nsgl_context.m
          sed -i '' 's/ADD_ATTRIB(NSOpenGLPFAAccelerated);//' glfw_sw/src/nsgl_context.m
          cmake -S glfw_sw -B glfw_sw/build -DBUILD_SHARED_LIBS=OFF -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF                 -DGLFW_BUILD_DOCS=OFF -DCMAKE_INSTALL_PREFIX=$HOME/deps/glfw_sw -DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET > /dev/null
          cmake --build glfw_sw/build --target install -j 4 > /dev/null
          curl -sL https://ftp.gnu.org/gnu/gsl/gsl-2.8.tar.gz | tar xz
          (cd gsl-2.8 && ./configure --prefix=$P --disable-shared -q && make -j 4 -s > /dev/null && make install -s > /dev/null)
          git clone -q --depth 1 https://github.com/jmcnamara/libxlsxwriter.git
          (cd libxlsxwriter && make -s > /dev/null && cp lib/libxlsxwriter.a $P/lib/ && cp -R include/* $P/include/)
          ls $P/lib

      - name: Build easyMelts and the command-line tool
        run: |
          set -e
          P=$HOME/deps/prefix; B=$(brew --prefix); SDK=$(xcrun --show-sdk-path)
          FW="-framework Cocoa -framework OpenGL -framework IOKit -framework CoreVideo -framework QuartzCore"
          make -s -f Makefiles/Makefile.MacOS easyMelts \
            CPP="clang++ -DFMT_HEADER_ONLY -I$P/include -I$B/include" \
            INCC=$P/include INCM=$P/include INCX=$P/include INCXML=$SDK/usr/include/libxml2 \
            PUBLIBS="$P/lib/libglfw3.a $P/lib/libxlsxwriter.a -lz $FW" \
            LIBBATCH="$P/lib/libgsl.a $P/lib/libgslcblas.a -lxml2 -lz -liconv"
          DEF="-DBATCH_VERSION -DRHYOLITE_ADJUSTMENTS -DEASYMELTS_UPDATE_SYSTEM"
          clang++ -O2 -std=c++17 $DEF -I./include -I./includes -I$P/include -I$SDK/usr/include/libxml2 -o geobarometer_cli \
            tests/geobarometer_cli.cpp src/geobarometer.cpp src/melts_interface.cpp src/e_utility.cpp src/file_utility.cpp \
            libMELTSbatch.a $P/lib/libgsl.a $P/lib/libgslcblas.a -lxml2 -lz -liconv
          mkdir -p gt && for f in e_utility file_utility imgui_demo imgui_draw imgui_input imgui_opengl_melts_version imgui_widgets imgui implot LiberationSans_Regular melts_interface xlsx_writer geobarometer geobarometer_tab; do
            clang++ -c -O2 -std=c++17 -DFMT_HEADER_ONLY -DGL_SILENCE_DEPRECATION $DEF -I./include -I./includes -I./include/imgui -I$P/include -I$B/include src/$f.cpp -o gt/$f.o
          done
          clang -c -O2 -I./include src/glad.c -o gt/glad.o
          clang++ -O2 -std=c++17 -DGL_SILENCE_DEPRECATION $DEF -I./include -I./includes -I./include/imgui -I$P/include -o geobarometer_gui_test \
            tests/geobarometer_gui_test.cpp gt/*.o libMELTSbatch.a $HOME/deps/glfw_sw/lib/libglfw3.a $P/lib/libxlsxwriter.a $P/lib/libgsl.a $P/lib/libgslcblas.a \
            -lxml2 -lz -liconv $FW
          ls -la easyMelts geobarometer_cli geobarometer_gui_test
          echo "Libraries the release binaries need (all must be system ones):"
          otool -L easyMelts geobarometer_cli | grep -v -E ":$|/usr/lib/|/System/Library/" && exit 1 || true
          lipo -archs easyMelts; otool -l easyMelts | grep -A3 LC_BUILD_VERSION | grep minos

      - name: Bishop Tuff check against the validated Windows and Linux results
        run: |
          set -e
          mkdir -p run && cd run
          ../geobarometer_cli --bishop out=mac 2>&1 | grep -a offset
          python3 ../tests/geobarometer_compare.py mac_detail.csv mac_summary.csv ../tests/geobarometer_reference_bishop_nno_detail.csv

      - name: GUI smoke test (hidden window)
        timeout-minutes: 20
        # the Apple silicon runners have no graphics device at all, so OpenGL cannot start there
        continue-on-error: ${{ matrix.arch == 'arm64' }}
        run: |
          system_profiler SPDisplaysDataType | grep -E "Chipset|Metal|Resolution|Display Type|Vendor" || echo "no display hardware reported"
          cd run && ../geobarometer_gui_test gui_${{ matrix.arch }}.ppm > gui.log 2>&1; status=$?
          grep -a -E "^frames|^  " gui.log || true; tail -5 gui.log; exit $status

      - name: Package
        if: always()
        run: |
          D=easyMelts_geobarometer_macos_${{ matrix.arch }}; mkdir -p $D
          cp easyMelts easyMelts.command geobarometer_cli LICENSE.txt GEOBAROMETER.md $D/ 2>/dev/null || true
          cp docs/easyMelts_geobarometer_guide.pdf docs/glasses_template.csv docs/README-macOS.txt $D/ 2>/dev/null || true
          chmod +x $D/easyMelts $D/easyMelts.command $D/geobarometer_cli 2>/dev/null || true
          ditto -c -k --keepParent $D $D.zip
          ls -la $D

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: easyMelts_geobarometer_macos_${{ matrix.arch }}
          path: |
            easyMelts_geobarometer_macos_${{ matrix.arch }}.zip
            run/*.csv
            run/*.ppm
            run/gui.log
